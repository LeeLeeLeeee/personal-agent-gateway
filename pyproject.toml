[project]
name = "personal-agent-gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.0",
  "httpx>=0.28.0",
  "python-dotenv>=1.1.0",
  "pyotp>=2.9.0",
  "qrcode>=8.0",
  "croniter>=6.0.0",
  # zoneinfo has no tz database of its own on Windows, so schedule handling
  # fails with ZoneInfoNotFoundError without this. It was present in the
  # long-lived venv by accident and absent from every fresh install, which
  # cost three schedule-test failures in a new worktree.
  "tzdata>=2025.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.15.20",
  "pytest-xdist>=3.8.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "evaluation"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

# Selected explicitly, not inherited. ruff's default rule set changes between
# versions -- 0.15 reports nothing on this tree while 0.16 reports 254, almost
# all of it newly-default import sorting -- so leaving selection implicit means
# the answer depends on whichever ruff an environment happened to resolve. These
# four are 0.15's defaults, pinned here so every checkout agrees. Adopting 0.16's
# stricter set is a real decision with 254 findings behind it, not a side effect
# of an upgrade.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
